<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzIHgddK6a0ttXIDgdW41uET1mRlZBe3OBsNf6CfGXUyrMyJ5OjfazoKEFwoM1U3wQq9Q/exec";
const NAMA_BULAN = ['','JANUARI','FEBRUARI','MARET','APRIL','MEI','JUNI','JULI','AGUSTUS','SEPTEMBER','OKTOBER','NOVEMBER','DESEMBER'];
const NAMA_HARI = ['SENIN','SELASA','RABU','KAMIS','JUMAT','SABTU','MINGGU'];

let curBulan = new Date().getMonth() + 1;
let curTahun = new Date().getFullYear();
let drivers = [];
let logs = {};

// ================== CORE ==================
async function api(params) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(API_URL + '?' + qs, { method: 'GET', redirect: 'follow' });
  return await res.json();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function setBadge(cls, text) {
  const b = document.getElementById('statusBadge');
  b.className = 'status-badge ' + cls;
  b.innerText = text;
}
function updateBadge() {
  if (!navigator.onLine) { setBadge('offline', 'OFFLINE'); return; }
  const p = getPending().length;
  if (p > 0) setBadge('pending', 'PENDING ' + p);
  else setBadge('online', 'ONLINE');
}

// ================== PENDING QUEUE ==================
function getPending() { try { return JSON.parse(localStorage.getItem('pending') || '[]'); } catch (e) { return []; } }
function setPending(arr) { localStorage.setItem('pending', JSON.stringify(arr)); updateBadge(); }

async function flushPending() {
  const pending = getPending();
  if (!pending.length) { updateBadge(); return; }
  setBadge('syncing', 'SYNC ' + pending.length);
  const remaining = [];
  for (let i = 0; i < pending.length; i++) {
    try { await api(pending[i]); } catch (e) { remaining.push(pending[i]); }
  }
  setPending(remaining);
  if (remaining.length === 0) toast('Semua data offline tersinkron');
  updateBadge();
}

// ================== DATA ==================
function getShifts(key) {
  const raw = logs[key];
  if (!raw) return [];
  if (Array.isArray(raw)) return raw;
  if (typeof raw === 'object' && (raw.out || raw.in)) {
    return [{ shift: 1, out: raw.out || '', in: raw.in || '' }];
  }
  return [];
}

async function refreshData(silent) {
  if (!navigator.onLine) { updateBadge(); return; }
  setBadge('syncing', 'SYNC...');
  try {
    await flushPending();
    const r1 = await api({ action: 'drivers' });
    if (r1.ok) drivers = r1.drivers || [];
    const r2 = await api({ action: 'data', bulan: curBulan, tahun: curTahun });
    if (r2.ok) logs = r2.data || {};
    localStorage.setItem('cache_drivers', JSON.stringify(drivers));
    localStorage.setItem('cache_logs_' + curBulan + '_' + curTahun, JSON.stringify(logs));
    renderTabel();
    updateBadge();
    if (!silent) toast('Tersinkron dengan Sheets');
  } catch (e) {
    setBadge('offline', 'GAGAL SYNC');
    if (!silent) toast('Sync gagal: ' + e.message);
  }
}

function loadCache() {
  try { drivers = JSON.parse(localStorage.getItem('cache_drivers') || '[]'); } catch (e) {}
  try { logs = JSON.parse(localStorage.getItem('cache_logs_' + curBulan + '_' + curTahun) || '{}'); } catch (e) {}
}

// ================== RENDER ==================
function driversUntukBulan(bulan, tahun) {
  const tglAwalStr = tahun + '-' + String(bulan).padStart(2,'0') + '-01';
  const lastDay = new Date(tahun, bulan, 0).getDate();
  const tglAkhirStr = tahun + '-' + String(bulan).padStart(2,'0') + '-' + String(lastDay).padStart(2,'0');
  return drivers.filter(function(d) {
    if (d.tglAktif && d.tglAktif > tglAkhirStr) return false;
    if (d.tglResign && d.tglResign < tglAwalStr) return false;
    return true;
  });
}

function renderTabel() {
  const jmlHari = new Date(curTahun, curBulan, 0).getDate();
  const daftarDriver = driversUntukBulan(curBulan, curTahun);
  document.getElementById('judul').innerText = 'KINERJA DRIVER BULAN ' + NAMA_BULAN[curBulan] + ' ' + curTahun;

async function simpanSemuaShift() {
  if (!currentShiftTarget) return;

  let errorMsg = '';
  let lastInAbs = -1;
  let parsedShifts = [];
  let hasCrossDay = false;

  // 1. Validasi Hari Ini
  for (let i = 0; i < currentShiftData.length; i++) {
    const s = currentShiftData[i];
    if (!s.out && !s.in) continue; 
    
    if (!s.out) {
      errorMsg = 'Shift ke-' + (i+1) + ' memiliki jam IN tetapi OUT kosong.';
      break;
    }
    
    const outM = toMins(s.out);
    let inM = s.in ? toMins(s.in) : 1439; 
    let inAbs = inM;
    
    // Cek bentrok (jika OUT lebih awal dari IN shift sebelumnya)
    if (lastInAbs !== -1 && outM < lastInAbs) {
       const prev = parsedShifts[parsedShifts.length - 1];
       errorMsg = 'Shift ke-' + (i+1) + ' berangkat jam ' + s.out + ', padahal Shift ke-' + parsedShifts.length + ' baru pulang jam ' + (prev.in || '23:59') + '.';
       break;
    }

    // Cek Lintas Hari
    if (s.in && inM < outM) {
       inAbs = inM + 1440; 
       hasCrossDay = true;
    }

    lastInAbs = inAbs;
    parsedShifts.push(s);
  }

  if (errorMsg) {
    alert('❌ INPUT DITOLAK\n\n' + errorMsg + '\n\nPastikan urutan jam benar dan lengkapi shift sebelumnya.');
    return;
  }

  if (parsedShifts.length === 0) {
    if (!confirm('Semua shift kosong. Hapus data shift hari ini?')) return;
  }

  // 2. Pisahkan shift hari ini & besok
  let shiftsForToday = [];
  let shiftsForTomorrow = [];
  
  parsedShifts.forEach(function(s) {
    const outM = toMins(s.out);
    const inM = s.in ? toMins(s.in) : 0;
    if (s.in && inM < outM) {
      shiftsForToday.push({ out: s.out, in: '23:59' });
      shiftsForTomorrow.push({ out: '00:00', in: s.in });
    } else {
      shiftsForToday.push(s);
    }
  });

  let shiftsBsk = [];
  let tglBsk = '';

  // 3. Validasi Hari Besok (jika ada lintas hari)
  if (shiftsForTomorrow.length > 0) {
    const d = new Date(currentShiftTarget.tgl + 'T00:00:00');
    d.setDate(d.getDate() + 1);
    tglBsk = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    
    try {
      const rBsk = await api({ action: 'data', bulan: d.getMonth()+1, tahun: d.getFullYear() });
      if (rBsk.ok && rBsk.data[currentShiftTarget.nama + '|' + tglBsk]) {
        shiftsBsk = rBsk.data[currentShiftTarget.nama + '|' + tglBsk];
      }
    } catch(e) { console.log(e); }

    let combinedTomorrow = shiftsForTomorrow.concat(shiftsBsk);
    combinedTomorrow.sort((a, b) => toMins(a.out) - toMins(b.out));
    
    let errBsk = '';
    let lastInBsk = -1;
    for (let i = 0; i < combinedTomorrow.length; i++) {
       const s = combinedTomorrow[i];
       if (!s.out && !s.in) continue; 
       
       if (!s.out) {
         errBsk = 'Data pada tanggal ' + tglBsk + ' memiliki jam IN tanpa jam OUT. Harap perbaiki manual di Google Sheets.';
         break;
       }
       
       const outM = toMins(s.out);
       let inM = s.in ? toMins(s.in) : 1439;
       let inAbs = inM;
       
       if (lastInBsk !== -1 && outM < lastInBsk) {
         errBsk = 'Akan terjadi bentrok pada tanggal ' + tglBsk + '.\nShift baru (mulai jam ' + s.out + ') menabrak shift sebelumnya (atau shift sebelumnya belum diisi jam IN-nya).';
         break;
       }
       
       if (s.in && inM < outM) {
         inAbs = inM + 1440;
       }
       
       lastInBsk = inAbs;
    }
    
    if (errBsk) {
       alert('❌ INPUT DITOLAK\n\n' + errBsk + '\n\nSilakan sesuaikan jam Anda atau lengkapi shift di tanggal ' + tglBsk + ' terlebih dahulu.');
       return;
    }
    
    shiftsBsk = combinedTomorrow;
  }
  
  if (hasCrossDay) {
    if (!confirm('⚠️ PERHATIAN: Ada shift yang melewati tengah malam.\nSistem akan otomatis membagi shift tersebut ke tanggal besok.\n\nLanjutkan Simpan?')) return;
  }

  toast('Menyimpan...');
  try {
    await api({ action: 'simpan_shifts', nama: currentShiftTarget.nama, tanggal: currentShiftTarget.tgl, shifts: JSON.stringify(shiftsForToday) });
    
    if (shiftsForTomorrow.length > 0) {
      await api({ action: 'simpan_shifts', nama: currentShiftTarget.nama, tanggal: tglBsk, shifts: JSON.stringify(shiftsBsk) });
    }

    toast('✅ Semua Shift tersimpan');
    tutupModalShift();
    refreshData(true);
  } catch(e) { 
    toast('Error: ' + e.message); 
  }
}

function bukaPickerShift(idx, type) {
  pickerTarget = null; pickerShiftTargetIdx = idx; pickerShiftTargetType = type;
  const val = currentShiftData[idx][type];
  if (val && /^\d{1,2}:\d{2}$/.test(val)) {
    const parts = val.split(':'); pickerHour = parseInt(parts[0], 10); pickerMin = parseInt(parts[1], 10);
  } else { pickerHour = null; pickerMin = null; }
  document.getElementById('pickerTitle').textContent = 'Pilih Jam ' + (type === 'out' ? 'OUT' : 'IN');
  document.getElementById('pickerInfo').innerHTML = '<b>Driver:</b> ' + currentShiftTarget.nama;
  updatePickerPreview(); document.getElementById('pickerJam').classList.add('show');
}

function updatePickerPreview() {
  document.querySelectorAll("#pickerHourGrid .picker-cell").forEach(function(c) { c.classList.toggle("selected", Number(c.textContent) === pickerHour); });
  document.querySelectorAll("#pickerMinGrid .picker-cell").forEach(function(c) { c.classList.toggle("selected", Number(c.textContent) === pickerMin); });
  const h = pickerHour !== null ? String(pickerHour).padStart(2, "0") : "--";
  const m = pickerMin !== null ? String(pickerMin).padStart(2, "0") : "--";
  document.getElementById("pickerPreview").textContent = h + ":" + m;
}

function pickerClear() {
  if (currentShiftTarget !== null && pickerTarget === null) {
    currentShiftData[pickerShiftTargetIdx][pickerShiftTargetType] = ''; renderListShift(); document.getElementById('pickerJam').classList.remove('show');
  } else if (pickerTarget) {
    pickerTarget.value = ''; saveCell(pickerTarget); tutupPicker(); toast('Jam dikosongkan');
  }
}

function pickerSave() {
  if (currentShiftTarget !== null && pickerTarget === null) {
    if (pickerHour === null || pickerMin === null) { toast('Pilih jam dulu'); return; }
    currentShiftData[pickerShiftTargetIdx][pickerShiftTargetType] = String(pickerHour).padStart(2,'0') + ':' + String(pickerMin).padStart(2,'0');
    renderListShift(); document.getElementById('pickerJam').classList.remove('show');
  } else if (pickerTarget) {
    if (pickerHour === null || pickerMin === null) { toast('Pilih jam & menit dulu'); return; }
    pickerTarget.value = String(pickerHour).padStart(2, '0') + ':' + String(pickerMin).padStart(2, '0');
    saveCell(pickerTarget); tutupPicker();
  }
}

  for (let h = 0; h < dateArr.length; h++) { const col = 2 + h * 2; ws['!merges'].push({s: {r: 2, c: col}, e: {r: 2, c: col + 1}}); }
  const wscols = [{wch: 5}, {wch: 15}]; for (let i = 0; i < dateArr.length * 2; i++) wscols.push({wch: 15}); ws['!cols'] = wscols;

  let fname = 'AbsensiDriver'; if (pakaiRange) fname += '_' + dariStr + '_sd_' + sampaiStr; else fname += '_' + NAMA_BULAN[bulan] + '_' + tahun; fname += '.xlsx';
  XLSX.writeFile(wb, fname); tutupModal('modalExport'); toast('File Excel siap');
}

// ================== RINGKASAN ==================
function hitungMenit(outStr, inStr) {
  if (!outStr || !inStr) return null;
  const p1 = String(outStr).split(':'); const p2 = String(inStr).split(':');
  if (p1.length < 2 || p2.length < 2) return null;
  const oh = Number(p1[0]), om = Number(p1[1]); const ih = Number(p2[0]), im = Number(p2[1]);
  if (isNaN(oh) || isNaN(om) || isNaN(ih) || isNaN(im)) return null;
  let m = (ih * 60 + im) - (oh * 60 + om); if (m < 0) m += 24 * 60; return m;
}
function formatJamKerja(menit) { if (menit === null || menit === undefined) return ''; const j = Math.floor(menit / 60); const m = menit % 60; return j + ':' + String(m).padStart(2, '0'); }

function bukaModalRingkasan() {
  document.getElementById('rngBulan').value = curBulan; document.getElementById('rngTahun').value = curTahun;
  document.getElementById('rngPakaiRange').checked = false; document.getElementById('rngRangeFields').style.display = 'none';
  const tgl1 = curTahun + '-' + String(curBulan).padStart(2,'0') + '-01'; const lastDay = new Date(curTahun, curBulan, 0).getDate();
  const tgl2 = curTahun + '-' + String(curBulan).padStart(2,'0') + '-' + String(lastDay).padStart(2,'0');
  document.getElementById('rngDari').value = tgl1; document.getElementById('rngSampai').value = tgl2;
  document.getElementById('modalRingkasan').classList.add('show'); renderRingkasan();
}

let lastRingkasan = null;
async function renderRingkasan() {
  const bulan = Number(document.getElementById('rngBulan').value); const tahun = Number(document.getElementById('rngTahun').value);
  const pakaiRange = document.getElementById('rngPakaiRange').checked; const dariStr = document.getElementById('rngDari').value; const sampaiStr = document.getElementById('rngSampai').value;
  let startDate, endDate;
  if (pakaiRange) { if (!dariStr || !sampaiStr) { toast('Isi tanggal'); return; } startDate = new Date(dariStr + 'T00:00:00'); endDate = new Date(sampaiStr + 'T00:00:00'); if (startDate > endDate) { toast('Tanggal dari > sampai'); return; } } else { startDate = new Date(tahun, bulan - 1, 1); endDate = new Date(tahun, bulan, 0); }
  toast('Menghitung ringkasan...');
  const bulanSet = []; let cur = new Date(startDate); while (cur <= endDate) { const key = cur.getFullYear() + '-' + (cur.getMonth() + 1); if (bulanSet.indexOf(key) === -1) bulanSet.push(key); cur.setDate(cur.getDate() + 1); }
  const dataAll = {};
  try { for (let i = 0; i < bulanSet.length; i++) { const parts = bulanSet[i].split('-'); const r = await api({ action: 'data', bulan: Number(parts[1]), tahun: Number(parts[0]) }); if (r.ok && r.data) for (const k in r.data) if (r.data.hasOwnProperty(k)) dataAll[k] = r.data[k]; } } catch(e) { toast('Gagal ambil data'); return; }
  let driversAll = drivers; try { const rd = await api({ action: 'drivers' }); if (rd.ok) driversAll = rd.drivers || []; } catch(e) {}
  const daftarDriver = driversAll.filter(function(d) { if (d.tglAktif && d.tglAktif > endDate.toISOString().slice(0,10)) return false; if (d.tglResign && d.tglResign < startDate.toISOString().slice(0,10)) return false; return true; });
  const dateArr = []; let cur2 = new Date(startDate); while (cur2 <= endDate) { dateArr.push(new Date(cur2)); cur2.setDate(cur2.getDate() + 1); }
  let grandTotalMenit = 0; const hasil = [];
  const bulanList = []; dateArr.forEach(function(tgl) { const key = tgl.getFullYear() + '-' + tgl.getMonth(); const last = bulanList[bulanList.length - 1]; if (!last || last.key !== key) { bulanList.push({ key: key, nama: NAMA_BULAN[tgl.getMonth()+1] + ' ' + tgl.getFullYear(), jumlah: 1 }); } else { last.jumlah++; } });
  const multiBulan = bulanList.length > 1;
  let html = '<table style="border-collapse:collapse;width:100%;font-size:10px;"><thead>';
  if (multiBulan) { html += '<tr><th rowspan="2" class="sticky-rng-no" style="padding:3px;">NO</th><th rowspan="2" class="sticky-rng-nama" style="padding:3px;text-align:left;">NAMA</th>'; bulanList.forEach(function(b) { html += '<th colspan="' + b.jumlah + '" style="background:#6b21a8;color:white;padding:3px;border:1px solid #555;font-size:10px;">' + b.nama + '</th>'; }); html += '<th rowspan="2" style="background:#28A745;color:white;padding:3px;border:1px solid #555;">TOTAL</th></tr><tr>'; } else { html += '<tr><th class="sticky-rng-no" style="padding:3px;">NO</th><th class="sticky-rng-nama" style="padding:3px;text-align:left;">NAMA</th>'; }
  for (let h = 0; h < dateArr.length; h++) { const tgl = dateArr[h]; const cls = tgl.getDay() === 1 ? 'background:#dc3545;color:white;' : 'background:#c4b5fd;'; html += '<th style="' + cls + 'padding:2px;border:1px solid #555;font-size:9px;">' + tgl.getDate() + '</th>'; }
  if (!multiBulan) { html += '<th style="background:#28A745;color:white;padding:3px;border:1px solid #555;">TOTAL</th>'; } html += '</tr></thead><tbody>';
  daftarDriver.forEach(function(drv, idx) {
    const rowData = { nama: drv.nama, hari: [], total: 0 }; let totalMenit = 0;
    html += '<tr><td class="sticky-rng-no" style="text-align:center;padding:2px;">' + (idx + 1) + '</td><td class="sticky-rng-nama" style="padding:2px 6px;font-weight:bold;">' + drv.nama + '</td>';
    for (let h = 0; h < dateArr.length; h++) {
      const tgl = dateArr[h]; const tglStr = tgl.getFullYear() + '-' + String(tgl.getMonth() + 1).padStart(2,'0') + '-' + String(tgl.getDate()).padStart(2,'0'); const shifts = dataAll[drv.nama + '|' + tglStr] || [];
      let menitHariIni = null;
      if (shifts.length > 0) { menitHariIni = 0; let valid = false; shifts.forEach(function(s) { const m = hitungMenit(s.out, s.in); if (m !== null) { menitHariIni += m; valid = true; } }); if (!valid) menitHariIni = null; }
      if (menitHariIni !== null) totalMenit += menitHariIni; rowData.hari.push(menitHariIni);
      const txt = menitHariIni !== null ? formatJamKerja(menitHariIni) : (shifts.length > 0 ? '?' : '');
      const warna = menitHariIni !== null ? '' : (shifts.length > 0 ? 'background:#fee2e2;' : 'background:#f9fafb;');
      html += '<td style="text-align:center;padding:2px;border:1px solid #eee;font-size:10px;' + warna + '">' + txt + '</td>';
    }
    rowData.total = totalMenit; grandTotalMenit += totalMenit;
    html += '<td style="text-align:center;padding:2px;border:1px solid #ccc;font-weight:bold;background:#d1fae5;">' + formatJamKerja(totalMenit) + '</td></tr>';
    hasil.push(rowData);
  });
  html += '</tbody><tfoot><tr><td colspan="' + (2 + dateArr.length) + '" style="text-align:right;padding:4px;border:1px solid #555;background:#9333ea;color:white;font-weight:bold;">GRAND TOTAL</td><td style="text-align:center;padding:4px;border:1px solid #555;background:#9333ea;color:white;font-weight:bold;">' + formatJamKerja(grandTotalMenit) + '</td></tr></tfoot></table>';
  document.getElementById('rngHasil').innerHTML = html;
  lastRingkasan = { periode: pakaiRange ? (dariStr + ' s/d ' + sampaiStr) : ('Bulan ' + bulan + '/' + tahun), drivers: hasil, dates: dateArr, grand: grandTotalMenit };
  toast('Ringkasan siap');
}

function exportRingkasanXLSX() {
  if (!lastRingkasan) { toast('Tampilkan dulu'); return; }
  if (typeof XLSX === 'undefined') { toast('Library XLSX belum siap'); return; }
  const blnShort = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
  const aoa = []; const head = ['NO', 'NAMA']; lastRingkasan.dates.forEach(function(tgl) { head.push(String(tgl.getDate()).padStart(2,'0') + '-' + blnShort[tgl.getMonth()]); }); head.push('TOTAL');
  aoa.push(['RINGKASAN KINERJA DRIVER']); aoa.push(['Periode: ' + lastRingkasan.periode]); aoa.push([]); aoa.push(head);
  lastRingkasan.drivers.forEach(function(d, idx) { const row = [idx + 1, d.nama]; d.hari.forEach(function(m) { row.push(m !== null ? formatJamKerja(m) : ''); }); row.push(formatJamKerja(d.total)); aoa.push(row); });
  const foot = ['', 'GRAND TOTAL']; for (let i = 0; i < lastRingkasan.dates.length; i++) foot.push(''); foot.push(formatJamKerja(lastRingkasan.grand)); aoa.push(foot);
  const wb = XLSX.utils.book_new(); const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = [{s: {r: 0, c: 0}, e: {r: 0, c: head.length - 1}}];
  const wscols = [{wch: 5}, {wch: 15}]; for (let i = 0; i < lastRingkasan.dates.length; i++) wscols.push({wch: 8}); wscols.push({wch: 10}); ws['!cols'] = wscols;
  XLSX.utils.book_append_sheet(wb, ws, 'Ringkasan'); XLSX.writeFile(wb, 'RingkasanDriver_' + lastRingkasan.periode.replace(/[^0-9A-Za-z]/g, '_') + '.xlsx'); toast('File ringkasan di-download');
}

function bukaModalAutoBackup() {
  document.getElementById('modalAutoBackup').classList.add('show'); document.getElementById('abStatus').innerHTML = 'Memuat status...';
  api({ action: 'status_autobackup' }).then(function(r) {
    if (r.ok) {
      document.getElementById('abEnabled').checked = r.enabled; document.getElementById('abMatrix').checked = r.matrixEnabled || false;
      if (r.jam) document.getElementById('abJam').value = r.jam; if (r.menit) document.getElementById('abMenit').value = r.menit; if (r.folder) document.getElementById('abFolder').value = r.folder;
      let statusHtml = '<b>Status:</b> ' + (r.enabled ? '✅ Aktif' : '❌ Nonaktif');
      if (r.lastTime) { const tgl = new Date(r.lastTime); statusHtml += '<br><b>Backup terakhir:</b> ' + tgl.toLocaleString('id-ID') + '<br><b>Hasil:</b> ' + (r.lastStatus || '-'); if (r.lastFile) statusHtml += '<br><b>File:</b> ' + r.lastFile; if (r.lastUrl) statusHtml += '<br><a href="' + r.lastUrl + '" target="_blank" style="color:#059669;">Buka di Drive &#8599;</a>'; if (r.lastMatrixTime) { const tglM = new Date(r.lastMatrixTime); statusHtml += '<br><b>Matrix terakhir:</b> ' + tglM.toLocaleString('id-ID') + ' (' + (r.lastMatrixStatus || '-') + ')'; } } else { statusHtml += '<br><i>Belum pernah backup</i>'; }
      document.getElementById('abStatus').innerHTML = statusHtml;
    } else { document.getElementById('abStatus').innerHTML = 'Error: ' + (r.error || 'tidak diketahui'); }
  }).catch(function(e) { document.getElementById('abStatus').innerHTML = 'Error: ' + e.message; });
}
async function simpanAutoBackup() {
  const enabled = document.getElementById('abEnabled').checked; const jam = Number(document.getElementById('abJam').value); const menit = Number(document.getElementById('abMenit').value); const folder = document.getElementById('abFolder').value.trim() || 'Backup_AbsensiDriver'; const matrixEnabled = document.getElementById('abMatrix').checked;
  if (!enabled) { toast('Centang "Aktifkan auto-backup" dulu'); return; } if (isNaN(jam) || jam < 0 || jam > 23) { toast('Jam 0-23'); return; } if (isNaN(menit) || menit < 0 || menit > 59) { toast('Menit 0-59'); return; }
  toast('Menyimpan setting...');
  try { const r = await api({ action: 'setup_autobackup', jam: jam, menit: menit, folder: folder, matrixEnabled: matrixEnabled }); if (r.ok) { toast('✅ ' + r.msg); setTimeout(bukaModalAutoBackup, 800); } else toast('Gagal: ' + r.error); } catch(e) { toast('Error: ' + e.message); }
}
async function matikanAutoBackup() { if (!confirm('Matikan auto-backup?')) return; try { const r = await api({ action: 'hapus_autobackup' }); if (r.ok) { toast('Auto-backup dimatikan'); setTimeout(bukaModalAutoBackup, 800); } else toast('Gagal: ' + r.error); } catch(e) { toast('Error: ' + e.message); } }
async function testAutoBackup() { if (!confirm('Buat file backup sekarang?')) return; toast('Membuat file backup...'); try { const r = await api({ action: 'test_autobackup' }); if (r.ok) { toast('✅ Berhasil: ' + r.file); setTimeout(bukaModalAutoBackup, 1200); } else toast('Gagal: ' + (r.error || 'tidak diketahui')); } catch(e) { toast('Error: ' + e.message); } }
